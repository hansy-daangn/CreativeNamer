<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
:root{--accent:#FA2D48;--accent-tint:rgba(250,45,72,.12);--bg:#F2F2F7;--card:#fff;--label:#000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.32);--sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;}
@media (prefers-color-scheme:dark){:root{--accent:#FF375F;--accent-tint:rgba(255,55,95,.18);--bg:#1E1E1E;--card:#2C2C2E;--label:#fff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.34);}}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;font-size:12.5px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;}
button,input{font:inherit;color:inherit;}
.wrap{padding:14px 14px 150px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.top h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em;}
.link{border:0;background:var(--fill);color:var(--accent);height:24px;padding:0 10px;border-radius:12px;font-size:11.5px;font-weight:600;cursor:pointer;}
.fc{font-size:12px;color:var(--label2);margin-bottom:6px;}
.fc.on{color:var(--accent);font-weight:600;}
.sec{margin-top:16px;}
.hd{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px;}
.hd b{font-size:14px;font-weight:700;}
.card{background:var(--card);border-radius:12px;padding:10px;}
.tog{border:0;background:var(--fill);color:var(--label2);height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:600;cursor:pointer;}
.tog.on{background:var(--accent-tint);color:var(--accent);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:0;background:var(--fill);height:28px;padding:0 12px;border-radius:14px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;}
.chip:hover{background:var(--fill2);}
.chip.on{background:var(--accent);color:#fff;font-weight:600;}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--sep);color:var(--label2);}
.chip.ghost.on{background:var(--accent);color:#fff;box-shadow:none;}
.row{display:flex;gap:6px;align-items:center;}
.prefix{display:none;align-items:center;height:26px;padding:0 4px 0 10px;border-radius:13px;background:var(--accent-tint);color:var(--accent);font-weight:600;white-space:nowrap;}
.prefix.on{display:inline-flex;}
.prefix button{border:0;background:transparent;color:inherit;cursor:pointer;}
.txt{flex:1;min-width:0;height:34px;border:0;border-radius:9px;background:var(--fill);padding:0 10px;font-size:13px;outline:none;}
.txt:focus{box-shadow:0 0 0 3px var(--accent-tint);}
.sub{margin-top:8px;}
.lab{font-size:11px;font-weight:600;color:var(--label2);margin:8px 0 6px;}
.shelf{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.shelf::-webkit-scrollbar{display:none;}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:.5px solid var(--sep);padding:10px 14px 12px;}
.pv{font-family:var(--mono);font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-all;max-height:50px;overflow:auto;}
.btn{margin-top:8px;width:100%;height:38px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.btn:disabled{opacity:.35;cursor:default;}
.status{display:none;margin-top:12px;padding:8px 10px;border-radius:10px;font-family:var(--mono);font-size:11px;line-height:1.5;word-break:break-all;}
.status.success{display:block;background:rgba(52,199,89,.14);color:#1F8A3E;}
.status.error{display:block;background:var(--accent-tint);color:var(--accent);}
.sync{font-size:10.5px;color:var(--label3);margin-top:12px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>CreativeNamer</h1><button class="link" id="openRules" title="웹에서 네이밍 규칙 편집">규칙 편집 ↗</button></div>
  <div class="fc" id="frameCount">프레임을 선택하세요</div>
  <div id="fields"></div>
  <div class="status" id="status"></div>
  <div class="sync" id="sync"></div>
</div>
<div class="dock">
  <div class="pv" id="pv"></div>
  <button class="btn" id="btnApply" disabled>이름 바꾸기</button>
</div>
<script>
/* 웹 · 데스크톱과 같은 Supabase 규칙(naming_rules)과 소재명(creative_names)을 사용합니다. */
var SB_URL="https://newoydegfbnnqujgiips.supabase.co";
var SB_KEY="sb_publishable_6remFFz9oGKffdlRakvdfg_OOLp6zYL";
var SB_H={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};
var SB_TBL=SB_URL+"/rest/v1/creative_names", SB_RULES=SB_URL+"/rest/v1/naming_rules";
var WEB_RULES="https://hansy-daangn.github.io/CreativeNamer/#rules";

var DEFAULT_RULES={v:3,sep:"_",slots:[
 {key:"type",label:"유형",kind:"auto",auto:"type",on:true,values:[{id:"image",v:"image",l:"이미지"},{id:"video",v:"video",l:"영상"}]},
 {key:"division",label:"구분",kind:"choice",on:true,optional:true,def:"maugrowth",values:[{v:"maugrowth",l:"maugrowth"}]},
 {key:"service",label:"서비스",kind:"choice",on:true,optional:true,def:"fleamarket",values:[{v:"fleamarket",l:"중고거래",s:"Fl"},{v:"jobs",l:"알바",s:"Jo"},{v:"group",l:"모임",s:"Gr"},{v:"realty",l:"부동산",s:"Rt"},{v:"car",l:"중고차",s:"Ca"},{v:"LocalAds",l:"비즈니스",s:"Ad"}]},
 {key:"material",label:"소재명",kind:"text",on:true,series:["promo","keyword","event","pickupMonthly","shortForm"]},
 {key:"resolution",label:"해상도",kind:"auto",auto:"res",on:true},
 {key:"date",label:"날짜",kind:"auto",auto:"date",on:true,fmt:"YYMM"}]};

var RULES=DEFAULT_RULES, rulesInfo="기본 규칙";
var st={sel:{},short:{},series:null,serOpen:false,text:{}};
var MATS=[], frames=[];
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function post(m){parent.postMessage({pluginMessage:m},"*");}
function persist(){post({type:"persist",store:{rules:RULES,rulesInfo:rulesInfo,st:{sel:st.sel,short:st.short,series:st.series},MATS:MATS}});}
function p2(n){return String(n).padStart(2,"0");}
function fmtDate(fmt){var t=new Date(),Y=String(t.getFullYear()),M=p2(t.getMonth()+1),D=p2(t.getDate());return ({YYMM:Y.slice(2)+M,YYYYMM:Y+M,YYMMDD:Y.slice(2)+M+D,YYYYMMDD:Y+M+D})[fmt]||Y.slice(2)+M;}
function camel(s){var p=(s||"").trim().split(/[\s_]+/).filter(Boolean);if(p.length<=1)return (s||"").trim();return p[0].charAt(0).toLowerCase()+p[0].slice(1)+p.slice(1).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join("");}
function slotBy(k){for(var i=0;i<RULES.slots.length;i++)if(RULES.slots[i].key===k)return RULES.slots[i];return null;}
function textOf(k){var el=document.querySelector('[data-text="'+k+'"]');return el?el.value.trim():(st.text[k]||"");}
function fixSel(){RULES.slots.forEach(function(s){if(s.kind!=="choice")return;var cur=st.sel[s.key],vals=s.values||[];
  if(cur===null&&s.optional!==false)return;if(cur!=null&&vals.some(function(v){return v.v===cur;}))return;
  st.sel[s.key]=s.def!=null?s.def:(s.optional!==false?null:(vals[0]?vals[0].v:null));});
  var m=slotBy("material");if(st.series&&!(m&&m.series&&m.series.indexOf(st.series)>=0))st.series=null;}

/* 프레임 공통 부분: 해상도 자리는 "{res}" 로 남겨 메인 스레드가 프레임별로 채움 */
function parts(){var out=[];RULES.slots.forEach(function(s){if(s.on===false)return;var t="";
  if(s.kind==="auto"){if(s.auto==="type"){var v=(s.values||[]).filter(function(x){return x.id==="image";})[0];t=v?v.v:"";}else if(s.auto==="res")t="{res}";else if(s.auto==="date")t=fmtDate(s.fmt);}
  else if(s.kind==="choice"){var c=st.sel[s.key];if(c!=null){var vv=(s.values||[]).filter(function(x){return x.v===c;})[0];if(vv)t=(st.short[s.key]&&vv.s)?vv.s:vv.v;}}
  else{t=textOf(s.key);if(t&&s.key==="material"&&st.series)t=st.series+"-"+t;}
  if(t)out.push(t);});return out;}
function nameFor(ps,w,h){return ps.map(function(p){return p==="{res}"?(w+"x"+h):p;}).filter(Boolean).join(RULES.sep||"_");}

function chip(label,on,cls){var b=document.createElement("button");b.className="chip"+(cls?" "+cls:"")+(on?" on":"");b.textContent=label;return b;}
function render(){
  fixSel();var host=$("fields");var keep={};host.querySelectorAll("[data-text]").forEach(function(e){keep[e.dataset.text]=e.value;});
  host.innerHTML="";
  RULES.slots.forEach(function(s){
    if(s.on===false||s.kind==="auto")return;
    var sec=document.createElement("div");sec.className="sec";var hd=document.createElement("div");hd.className="hd";hd.innerHTML="<b>"+esc(s.label)+"</b>";
    var card=document.createElement("div");card.className="card";
    if(s.kind==="choice"){
      if((s.values||[]).some(function(v){return v.s;})){var t=chip("약어로 표기",st.short[s.key],"tog");t.className="tog"+(st.short[s.key]?" on":"");t.onclick=function(){st.short[s.key]=!st.short[s.key];persist();render();};hd.appendChild(t);}
      var box=document.createElement("div");box.className="chips";
      if(s.optional!==false){var n=chip("없음",st.sel[s.key]==null,"ghost");n.onclick=function(){st.sel[s.key]=null;persist();render();};box.appendChild(n);}
      (s.values||[]).forEach(function(v){var b=chip(v.l||v.v,st.sel[s.key]===v.v);b.title=(st.short[s.key]&&v.s)?v.s:v.v;b.onclick=function(){st.sel[s.key]=v.v;persist();render();};box.appendChild(b);});
      card.appendChild(box);
    }else{
      var isMat=s.key==="material";
      if(isMat&&s.series&&s.series.length){var tg=document.createElement("button");tg.className="tog"+((st.series||st.serOpen)?" on":"");tg.textContent="시리즈 소재";tg.onclick=function(){st.serOpen=!st.serOpen;if(!st.serOpen)st.series=null;persist();render();};hd.appendChild(tg);}
      var r=document.createElement("div");r.className="row";
      if(isMat){var p=document.createElement("span");p.className="prefix"+(st.series?" on":"");p.innerHTML=esc(st.series||"")+'-<button>✕</button>';p.querySelector("button").onclick=function(){st.series=null;persist();render();};r.appendChild(p);}
      var inp=document.createElement("input");inp.className="txt";inp.dataset.text=s.key;inp.autocomplete="off";inp.placeholder=isMat?"소재명 (예: newYear)":s.label+" 입력";
      inp.value=keep[s.key]!=null?keep[s.key]:(st.text[s.key]||"");inp.oninput=function(){st.text[s.key]=inp.value;preview();};
      inp.onblur=function(){if(isMat){inp.value=camel(inp.value);st.text[s.key]=inp.value;preview();}};r.appendChild(inp);card.appendChild(r);
      if(isMat&&(st.serOpen||st.series)&&s.series&&s.series.length){var sb=document.createElement("div");sb.className="sub";var bx=document.createElement("div");bx.className="chips";
        s.series.forEach(function(pf){var b=chip(pf,st.series===pf);b.onclick=function(){st.series=st.series===pf?null:pf;persist();render();};bx.appendChild(b);});sb.appendChild(bx);card.appendChild(sb);}
      if(isMat){var l=document.createElement("div");l.className="lab";l.textContent="최근 소재";card.appendChild(l);var sh=document.createElement("div");sh.className="shelf";sh.id="sug";card.appendChild(sh);}
    }
    sec.appendChild(hd);sec.appendChild(card);host.appendChild(sec);
  });
  renderSug();preview();$("sync").textContent="규칙: "+rulesInfo;
}
function renderSug(){var box=$("sug");if(!box)return;box.innerHTML="";
  if(!MATS.length){box.innerHTML='<span style="color:var(--label3);font-size:11px">저장된 소재명이 없어요</span>';return;}
  MATS.slice(0,40).forEach(function(it){var b=chip(it.n,false);b.onclick=function(){
    st.text.material=it.n;var el=document.querySelector('[data-text="material"]');if(el)el.value=it.n;
    var sv=slotBy("service");if(it.service&&sv&&(sv.values||[]).some(function(v){return v.v===it.service;}))st.sel.service=it.service;
    var dv=slotBy("division");if(dv&&Object.prototype.hasOwnProperty.call(it,"division")&&(it.division==null||(dv.values||[]).some(function(v){return v.v===it.division;})))st.sel.division=it.division==null?null:it.division;
    var m=slotBy("material");st.series=(it.series&&m&&m.series&&m.series.indexOf(it.series)>=0)?it.series:null;persist();render();};box.appendChild(b);});}
function preview(){var ps=parts(),text;
  if(frames.length){var used={};text=frames.map(function(f){var base=nameFor(ps,f.w,f.h),nm=base,d=2;while(used[nm.toLowerCase()]){nm=base+"_v"+d;d++;}used[nm.toLowerCase()]=1;return nm;}).join("\n");}
  else text=nameFor(ps,"W","H");
  $("pv").textContent=text;$("btnApply").disabled=!frames.length;$("btnApply").textContent=frames.length?frames.length+"개 이름 바꾸기":"이름 바꾸기";}

/* 서버 */
function normRules(r){return (r&&Array.isArray(r.slots)&&r.slots.length)?r:DEFAULT_RULES;}
function pullRules(){fetch(SB_RULES+"?select=id,created_at,label,rules&order=id.desc&limit=1",{headers:SB_H,cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(rows){
  if(!rows||!rows[0])return;var row=rows[0];RULES=normRules(row.rules);rulesInfo=(row.label||("#"+row.id))+" (서버 최신)";persist();render();}).catch(function(){rulesInfo=rulesInfo.replace(" (서버 최신)","")+" · 오프라인";$("sync").textContent="규칙: "+rulesInfo;});}
function pullMats(){fetch(SB_TBL+"?active=eq.true&select=name,service,series,division&order=updated_at.desc",{headers:SB_H}).then(function(r){return r.ok?r.json():null;}).then(function(rows){
  if(!Array.isArray(rows))return;MATS=rows.map(function(x){var o={n:x.name};if(x.service)o.service=x.service;if(x.series)o.series=x.series;if(x.division!=null)o.division=x.division;return o;});persist();renderSug();}).catch(function(){});}
function addMat(n){n=(n||"").trim();if(!n)return;var rec={n:n};if(st.sel.service)rec.service=st.sel.service;rec.division=st.sel.division==null?null:st.sel.division;if(st.series)rec.series=st.series;
  MATS=MATS.filter(function(m){return m.n.toLowerCase()!==n.toLowerCase();});MATS.unshift(rec);persist();renderSug();
  fetch(SB_TBL+"?on_conflict=name_key",{method:"POST",headers:Object.assign({Prefer:"resolution=merge-duplicates,return=minimal"},SB_H),body:JSON.stringify({name:rec.n,name_key:rec.n.toLowerCase(),service:rec.service||null,series:rec.series||null,division:rec.division,active:true,updated_at:new Date().toISOString()})}).catch(function(){});}

$("openRules").onclick=function(){post({type:"open-url",url:WEB_RULES});};
$("btnApply").onclick=function(){if(!frames.length)return;var el=document.querySelector('[data-text="material"]');if(el){el.value=camel(el.value);st.text.material=el.value;}
  $("status").className="status";post({type:"apply-names",parts:parts(),sep:RULES.sep||"_"});addMat(textOf("material"));};

window.onmessage=function(event){var msg=event.data.pluginMessage;if(!msg)return;
  if(msg.type==="selection"){frames=msg.frames||[];var el=$("frameCount");el.textContent=frames.length?"프레임 "+frames.length+"개 선택됨":"프레임을 선택하세요";el.className="fc"+(frames.length?" on":"");preview();}
  if(msg.type==="state"){var s=msg.store;if(s){if(s.rules)RULES=normRules(s.rules);if(s.rulesInfo)rulesInfo=s.rulesInfo;if(s.st){st.sel=s.st.sel||{};st.short=s.st.short||{};st.series=s.st.series||null;}if(Array.isArray(s.MATS))MATS=s.MATS;}
    render();pullRules();pullMats();}
  if(msg.type==="done"){$("status").className="status success";$("status").innerHTML=msg.names.map(function(n){return "✓ "+esc(n);}).join("<br>");preview();}
  if(msg.type==="error"){$("status").className="status error";$("status").textContent="✕ "+msg.text;}
};
render();post({type:"init"});
</script>
</body>
</html>
