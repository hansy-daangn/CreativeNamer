name: Build Windows app

# 'v'로 시작하는 태그(예: v1.0.0)를 푸시하면 윈도우용 .exe를 빌드해
# GitHub Releases에 자동으로 올립니다(설치파일 + 무설치 실행파일, 딱 2개).
# 수동 실행(Actions 탭 → Run workflow)이나 검증용 브랜치 푸시는 릴리스를 만들지 않고
# 빌드 결과만 Artifacts(windows-app)로 첨부합니다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare frontend (dist)
        shell: bash
        run: |
          mkdir -p dist
          cp index.html dist/
          cp icon.svg dist/ 2>/dev/null || true
          cp manifest.webmanifest dist/ 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build (tauri build → installer + binary)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .

      - name: Collect outputs (flat, friendly names)
        shell: bash
        run: |
          mkdir -p out
          # 무설치 실행파일 (자산 이름은 ASCII로 — 한글 자산명은 업로드 라벨 단계에서 실패함)
          if [ -f "src-tauri/target/release/CreativeNamer.exe" ]; then
            cp "src-tauri/target/release/CreativeNamer.exe" "out/CreativeNamer-Run.exe"
          else
            cp "src-tauri/target/release/creativenamer.exe" "out/CreativeNamer-Run.exe"
          fi
          # 설치파일 (NSIS)
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/CreativeNamer-Setup.exe"
          ls -la out

      - name: Publish Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          name: "파일명 일괄 변경기 ${{ github.ref_name }}"
          body: |
            드래그앤드롭으로 파일 이름을 즉시(확인창 없이) 바꾸는 윈도우 앱입니다.

            - **CreativeNamer-Run.exe** — 무설치(실행). 받아서 더블클릭하면 바로 실행됩니다. (가장 간단)
            - **CreativeNamer-Setup.exe** — 설치형. 시작메뉴 아이콘 생성 + WebView2 자동 처리.

            처음 실행 시 "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행** 을 누르세요. (서명되지 않은 앱이라 처음 1회만)
          files: |
            out/CreativeNamer-Run.exe
            out/CreativeNamer-Setup.exe

      - name: Upload build artifacts (every run)
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          if-no-files-found: warn
          path: out/*.exe
