name: Build apps

# 'v'로 시작하는 태그를 푸시하면 윈도우(.exe) + 맥(.dmg)을 빌드해 Releases에 올립니다.
# 수동 실행(Actions → Run workflow)은 릴리스 없이 빌드 결과만 Artifacts로 첨부합니다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
            rust_targets: ""
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare frontend (dist)
        shell: bash
        run: |
          mkdir -p dist
          cp index.html dist/
          cp icon.svg dist/ 2>/dev/null || true
          cp manifest.webmanifest dist/ 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}

      - name: Collect outputs (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p out
          if [ -f src-tauri/target/release/CreativeNamer.exe ]; then
            cp src-tauri/target/release/CreativeNamer.exe "out/CreativeNamer-Run.exe"
          else
            cp src-tauri/target/release/creativenamer.exe "out/CreativeNamer-Run.exe"
          fi
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/CreativeNamer-Setup.exe"
          ls -la out

      - name: Collect outputs (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/CreativeNamer.dmg"
          ls -la out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          if-no-files-found: error
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      - name: List collected assets
        run: ls -laR dist-assets

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          name: "파일명 일괄 변경기 ${{ github.ref_name }}"
          body: |
            파일을 끌어다 놓으면 규칙에 맞는 이름으로 한 번에 바꿔주는 프로그램입니다.

            - **CreativeNamer-Run.exe** — 윈도우 무설치(실행). 받아서 더블클릭. (가장 간단)
            - **CreativeNamer-Setup.exe** — 윈도우 설치형. 시작메뉴 아이콘 + WebView2 자동 처리.
            - **CreativeNamer.dmg** — 맥용(Intel/Apple Silicon 공용).

            처음 실행 시: (윈도우) "Windows의 PC 보호" → **추가 정보 → 실행** · (맥) 앱을 **우클릭 → 열기 → 열기**.
            서명되지 않은 앱이라 처음 1회만 나오는 정상 절차입니다.
          files: dist-assets/*
