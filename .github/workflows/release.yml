name: Build apps

# 기본 브랜치에 앱 코드(index.html, src-tauri 등)가 반영되면 자동으로 윈도우(.exe) + 맥(.dmg)을 빌드해
# tauri.conf.json의 버전(v{version}) 릴리스로 게시합니다. 같은 버전이면 기존 릴리스를 최신 빌드로 교체합니다.
# 'v'로 시작하는 태그를 푸시해도 빌드·게시합니다.
# 수동 실행(Actions → Run workflow)은 publish_version을 적으면 그 태그로 릴리스를 게시하고,
# 비워 두면 릴리스 없이 빌드 산출물(Artifacts)만 첨부합니다.
on:
  push:
    tags: ["v*"]
    branches: ["claude/charming-wright-pj3zxd", "main"]
    paths:
      - "index.html"
      - "icon.svg"
      - "manifest.webmanifest"
      - "src-tauri/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish_version:
        description: "이 태그로 릴리스 게시 (예: v1.3.0). 비우면 빌드 산출물(Artifacts)만 생성."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
            rust_targets: ""
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare frontend (dist)
        shell: bash
        run: |
          mkdir -p dist
          cp index.html dist/
          cp icon.svg dist/ 2>/dev/null || true
          cp manifest.webmanifest dist/ 2>/dev/null || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build (tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}

      - name: Collect outputs (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p out
          if [ -f src-tauri/target/release/CreativeNamer.exe ]; then
            cp src-tauri/target/release/CreativeNamer.exe "out/CreativeNamer-Run.exe"
          else
            cp src-tauri/target/release/creativenamer.exe "out/CreativeNamer-Run.exe"
          fi
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/CreativeNamer-Setup.exe"
          ls -la out

      - name: Collect outputs (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/CreativeNamer.dmg"
          ls -la out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          if-no-files-found: error
          path: out/*

  release:
    needs: build
    if: github.event_name == 'push' || github.event.inputs.publish_version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (version)
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.publish_version }}" ]; then
            echo "tag=${{ github.event.inputs.publish_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      - name: List collected assets
        run: ls -laR dist-assets

      - name: Replace existing release of the same version
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          name: "CreativeNamer ${{ steps.tag.outputs.tag }}"
          body: |
            파일을 끌어다 놓으면 규칙에 맞는 이름으로 한 번에 바꿔주는 프로그램입니다.
            네이밍 규칙은 앱의 **네이밍 규칙** 탭에서 바로 바꿀 수 있고, 웹·Figma와 실시간으로 공유돼요.

            - **CreativeNamer-Run.exe** — 윈도우 무설치(실행). 받아서 더블클릭. (가장 간단)
            - **CreativeNamer-Setup.exe** — 윈도우 설치형. 시작메뉴 아이콘 + WebView2 자동 처리.
            - **CreativeNamer.dmg** — 맥용(Intel/Apple Silicon 공용).

            처음 실행 시: (윈도우) "Windows의 PC 보호" → **추가 정보 → 실행** · (맥) 앱을 **우클릭 → 열기 → 열기**.
            서명되지 않은 앱이라 처음 1회만 나오는 정상 절차입니다.
          files: dist-assets/*
